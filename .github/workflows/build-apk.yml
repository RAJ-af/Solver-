name: Build Release APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # .env gitignored hai — asset bundling ke liye dummy chahiye
      - name: Create placeholder .env
        run: |
          echo "API_BASE_URL=https://openrouter.ai/api/v1/chat/completions" >> .env
          echo "API_KEY=placeholder" >> .env
          echo "API_MODEL=stealth/ox-alpha" >> .env

      - name: Create .env from secret
        run: |
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
          echo "API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "API_MODEL=${{ vars.API_MODEL }}" >> .env

      - name: Verify API credentials before build
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" "${{ vars.API_BASE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"model": "${{ vars.API_MODEL }}", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 5}')
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "API check FAILED. Response:"
            cat response.json
            exit 1
          fi
          echo "API check passed"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-doubt-solver-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
